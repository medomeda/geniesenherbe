# ==========================================================================
#  Génies en Herbe — Docker Compose pour Coolify
#  Le domaine et le HTTPS (obligatoire pour le micro) sont gérés par Coolify.
# ==========================================================================
services:
  geniesenherbe:
    build:
      context: .
      dockerfile: Dockerfile
    image: geniesenherbe:latest
    restart: unless-stopped
    environment:
      # Coolify génère l'URL et route le trafic vers le port 3000 du conteneur
      - SERVICE_FQDN_GENIESENHERBE_3000
      - NODE_ENV=production
      - PORT=3400
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    # Pas de "ports:" : le proxy de Coolify (Traefik/Caddy) accède au conteneur
    # via le réseau interne. Décommente pour un test local hors Coolify :
    # ports:
    #   - "3400:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
