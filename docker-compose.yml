# ==========================================================================
#  Génies en Herbe — Docker Compose pour Coolify
#  Le domaine et le HTTPS (obligatoire pour le micro) sont gérés par Coolify.
# ==========================================================================
services:
  geniesenherbe:
    build:
      context: .
      dockerfile: Dockerfile
    image: geniesenherbe:latest
    restart: unless-stopped
    environment:
      # Coolify génère l'URL et route le trafic vers le port 3000 du conteneur
      - SERVICE_FQDN_GENIESENHERBE_3000
      - NODE_ENV=production
      - PORT=3401
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    # Pas de "ports:" nécessaires avec Coolify : son proxy interne (Traefik/Caddy)
    # achemine le trafic vers le conteneur via le réseau Docker.
    expose:
      - "3401"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3401/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
